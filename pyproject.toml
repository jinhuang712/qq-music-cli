[project]
name = "qq-music-cli"
version = "0.5.1"
description = "管理你自己 QQ 音乐曲库的命令行工具（歌单、我喜欢、歌曲元数据），为 coding agent 设计。非官方项目。"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "qrcode>=7.4,<9",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://jinhuang712.github.io/qq-music-cli/"
Repository = "https://github.com/jinhuang712/qq-music-cli"

[project.scripts]
qqmusic = "qq_music_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_music_cli"]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.15.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options through call defaults by design
extend-immutable-calls = ["typer.Option", "typer.Argument"]
